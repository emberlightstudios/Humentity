[package]
name = "humentity"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
rand = "0.8.5"

[dependencies]
#ahash = { workspace = true }
#bevy = { workspace = true }
#smallvec = { workspace = true }
bevy = { version = ">=0.17.2", features = ["dynamic_linking", "experimental_bevy_feathers"] }
smallvec = { version = ">=1.15.1" }
ahash = { version = ">=0.8.12", features = ["serde"] }
bytemuck = "1.24.0"
gltf = "1.4.1"
rand = "0.8.5"
serde = "1.0.228"
serde_json = "1.0.145"
walkdir = "2.5.0"
avian3d = { version = ">=0.4.0" }
bevy_obj = ">=0.17.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
all = "deny"
missing_const_for_fn = "deny"
or_fun_call = "deny"
get_first = "deny"
redundant_clone = "deny"
manual_ok_or = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
get_unwrap = "deny"
manual_while_let_some = "deny"
panicking_unwrap = "deny"
unnecessary_unwrap = "deny"
unnecessary_literal_unwrap = "deny"
unwrap_in_result = "deny"
too_many_arguments = {level = "allow", priority = 10 }
type_complexity = {level = "allow", priority = 10 }

[lints.rust]
nonstandard-style = "deny"
future-incompatible = "deny"
non_local_definitions = "deny"