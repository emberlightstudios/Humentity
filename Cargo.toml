[package]
name = "humentity"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
rand = "0.8.5"
toml = "0.9.11"

[dependencies]
ahash = { version = ">=0.8.12", features = ["serde"] }
bevy = ">=0.18.0"
serde = ">=1.0.228"
walkdir = ">=2.5.0"
avian3d = { version = ">=0.5.0", optional = true }
serde_json = ">=1.0.145"
bytemuck = ">=1.24.0"
gltf = ">=1.4.1"
bevy_obj = ">=0.17.1"
crossbeam-channel = "0.5.15"

[features]
default = []
ragdolls = ["dep:avian3d"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
all = "deny"
missing_const_for_fn = "deny"
or_fun_call = "deny"
get_first = "deny"
redundant_clone = "deny"
manual_ok_or = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
get_unwrap = "deny"
manual_while_let_some = "deny"
panicking_unwrap = "deny"
unnecessary_unwrap = "deny"
unnecessary_literal_unwrap = "deny"
unwrap_in_result = "deny"
too_many_arguments = {level = "allow", priority = 16 }
type_complexity = {level = "allow", priority = 10 }

[lints.rust]
nonstandard-style = "deny"
future-incompatible = "deny"
non_local_definitions = "deny"
