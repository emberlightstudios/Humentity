[package]
name = "humentity"
version = "0.19.0"
edition = "2024"

[dependencies]
bevy = "0.20.0"
ahash = { version = ">=0.8.12", features = ["serde"] }
serde = { version = ">=1.0.228", features = ["derive"] }
walkdir = ">=2.5.0"
serde_json = ">=1.0.150"
bytemuck = ">=1.25.0"
gltf = ">=1.4.1"
bevy_obj = { git = "https://github.com/emberlightstudios/bevy_obj", rev = "480b4f86c382d488d93be54cd591155a89390070", default-features = false, features = ["mesh"] }
crossbeam-channel = ">=0.5.15"
toml = ">=1.1.2"
thiserror = ">=2.0.18"
avian3d = { optional = true, version = "0.7.0" }
bevy_jolt = { git = "https://github.com/emberlightstudios/bevy_jolt", rev = "db524058878d543e64b55ac25c1c12ce2b0180eb", optional = true }

[dev-dependencies]
bevy = { version = "0.20.0", features = ["bevy_feathers", "bevy_dev_tools", "render_dev_tools"] }
bevy-inspector-egui = "0.38.0"
bevy_egui = "0.43.1"

[[example]]
name = "ragdoll_avian"
required-features = ["avian"]

[[example]]
name = "ragdoll_avian_partial"
required-features = ["avian"]

[[example]]
name = "stress_test_ragdoll_avian"
required-features = ["avian"]

[[example]]
name = "ragdoll_dof"
required-features = ["avian"]

[[example]]
name = "ragdoll_jolt"
required-features = ["jolt"]

[[example]]
name = "ragdoll_joints_jolt"
required-features = ["jolt"]

[features]
default = []
debug = ["bevy/debug"]
avian = ["dep:avian3d"]
jolt = ["dep:bevy_jolt"]

[lints.clippy]
all = "deny"
missing_const_for_fn = "deny"
or_fun_call = "deny"
get_first = "deny"
redundant_clone = "deny"
manual_ok_or = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
get_unwrap = "deny"
manual_while_let_some = "deny"
panicking_unwrap = "deny"
unnecessary_unwrap = "deny"
unnecessary_literal_unwrap = "deny"
unwrap_in_result = "deny"
too_many_arguments = {level = "allow", priority = 16 }
type_complexity = {level = "allow", priority = 10 }

[lints.rust]
nonstandard-style = "deny"
future-incompatible = "deny"
non_local_definitions = "deny"
