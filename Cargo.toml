[package]
name = "humentity"
version = "0.19.0"
edition = "2024"

[dependencies]
bevy.workspace = true
ahash = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
walkdir.workspace = true
serde_json.workspace = true
bytemuck.workspace = true
gltf.workspace = true
bevy_obj.workspace = true
crossbeam-channel.workspace = true
toml.workspace = true
thiserror.workspace = true
avian3d = { workspace = true, optional = true }

bevy_mod_physx = { workspace = true, optional = true }

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_feathers"] }
bevy-inspector-egui.workspace = true
bevy_egui.workspace = true

[[example]]
name = "ragdoll_physx"
required-features = ["physx"]

[[example]]
name = "ragdoll_avian"
required-features = ["avian"]

[[example]]
name = "ragdoll_avian_partial"
required-features = ["avian"]

[[example]]
name = "stress_test_ragdoll_avian"
required-features = ["avian"]

[features]
default = []
debug = ["bevy/debug"]
avian = ["dep:avian3d"]
physx = ["dep:bevy_mod_physx"]

[lints.clippy]
all = "deny"
missing_const_for_fn = "deny"
or_fun_call = "deny"
get_first = "deny"
redundant_clone = "deny"
manual_ok_or = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
get_unwrap = "deny"
manual_while_let_some = "deny"
panicking_unwrap = "deny"
unnecessary_unwrap = "deny"
unnecessary_literal_unwrap = "deny"
unwrap_in_result = "deny"
too_many_arguments = {level = "allow", priority = 16 }
type_complexity = {level = "allow", priority = 10 }

[lints.rust]
nonstandard-style = "deny"
future-incompatible = "deny"
non_local_definitions = "deny"
