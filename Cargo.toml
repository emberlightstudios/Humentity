[package]
name = "humentity"
version = "0.18.1"
edition = "2024"

[dependencies]
bevy = "0.19.0"
ahash = { version = ">=0.8.12", features = ["serde"] }
serde = { version = ">=1.0.228", features = ["derive"] }
walkdir = ">=2.5.0"
serde_json = ">=1.0.150"
bytemuck = ">=1.25.0"
gltf = ">=1.4.1"
bevy_obj = "0.19.0"
crossbeam-channel = ">=0.5.15"
toml = ">=1.1.2"
thiserror = ">=2.0.18"
avian3d = { optional = true, version = "0.7.0" }

bevy_mod_physx = { optional = true, path = "../bevy_mod_physx" }
bevy_rapier3d = { optional = true, version = "0.34.0" }

[dev-dependencies]
bevy = { version = "0.19.0", features = ["bevy_feathers"] }
bevy-inspector-egui = "0.37.0"
bevy_egui = "0.40.0"

[[example]]
name = "ragdoll_physx"
required-features = ["physx"]

[[example]]
name = "ragdoll_rapier"
required-features = ["rapier"]

[[example]]
name = "ragdoll_avian"
required-features = ["avian"]

[[example]]
name = "ragdoll_avian_partial"
required-features = ["avian"]

[features]
default = []
debug = ["bevy/debug"]
avian = ["dep:avian3d"]
physx = ["dep:bevy_mod_physx"]
rapier = ["dep:bevy_rapier3d"]

[lints.clippy]
all = "deny"
missing_const_for_fn = "deny"
or_fun_call = "deny"
get_first = "deny"
redundant_clone = "deny"
manual_ok_or = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
get_unwrap = "deny"
manual_while_let_some = "deny"
panicking_unwrap = "deny"
unnecessary_unwrap = "deny"
unnecessary_literal_unwrap = "deny"
unwrap_in_result = "deny"
too_many_arguments = {level = "allow", priority = 16 }
type_complexity = {level = "allow", priority = 10 }

[lints.rust]
nonstandard-style = "deny"
future-incompatible = "deny"
non_local_definitions = "deny"
