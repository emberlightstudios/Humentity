[package]
name = "humentity"
version = "0.19.0"
edition = "2024"

[dependencies]
bevy.workspace = true
serde = { workspace = true, features = ["derive"] }
walkdir.workspace = true
serde_json.workspace = true
bytemuck = ">=1.25.0"
gltf = ">=1.4.1"
crossbeam-channel = ">=0.5.15"
bevy_obj = { workspace = true, default-features = false, features = ["mesh"] }
toml.workspace = true
thiserror.workspace = true
avian3d = { version = "0.8.0", optional = true }
bevy_jolt = { workspace = true, optional = true }

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_feathers", "bevy_dev_tools", "render_dev_tools"] }
bevy-inspector-egui.workspace = true
bevy_egui.workspace = true

[[example]]
name = "ragdoll_avian"
required-features = ["avian"]

[[example]]
name = "ragdoll_avian_partial"
required-features = ["avian"]

[[example]]
name = "stress_test_ragdoll_avian"
required-features = ["avian"]

[[example]]
name = "ragdoll_dof"
required-features = ["avian"]

[[example]]
name = "ragdoll_jolt"
required-features = ["jolt"]

[[example]]
name = "ragdoll_joints_jolt"
required-features = ["jolt"]

[features]
default = []
debug = ["bevy/debug"]
avian = ["dep:avian3d"]
jolt = ["dep:bevy_jolt"]

[lints.clippy]
all = "deny"
missing_const_for_fn = "deny"
or_fun_call = "deny"
get_first = "deny"
redundant_clone = "deny"
manual_ok_or = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
get_unwrap = "deny"
manual_while_let_some = "deny"
panicking_unwrap = "deny"
unnecessary_unwrap = "deny"
unnecessary_literal_unwrap = "deny"
unwrap_in_result = "deny"
too_many_arguments = {level = "allow", priority = 16 }
type_complexity = {level = "allow", priority = 10 }

[lints.rust]
nonstandard-style = "deny"
future-incompatible = "deny"
non_local_definitions = "deny"
